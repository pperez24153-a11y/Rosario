<style>
:root{--bg1:#f3f7ff;--bg2:#cfdcff;--bg3:#fff3d2;--ink:#1c2760;--soft:#46568f;--gold:#8f6300;--glass:rgba(255,255,255,.66);--line:rgba(143,99,0,.4);--glow:rgba(255,222,140,.7);--stars:0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#060a22;--bg2:#15206a;--bg3:#4a63b8;--ink:#eef3ff;--soft:#b9c6ee;--gold:#f0cf7a;--glass:rgba(18,28,88,.58);--line:rgba(240,207,122,.45);--glow:rgba(255,240,190,.35);--stars:1}}
:root[data-theme="dark"]{--bg1:#060a22;--bg2:#15206a;--bg3:#4a63b8;--ink:#eef3ff;--soft:#b9c6ee;--gold:#f0cf7a;--glass:rgba(18,28,88,.58);--line:rgba(240,207,122,.45);--glow:rgba(255,240,190,.35);--stars:1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;background:var(--bg1) linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--stars)}
body::before{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 70px,#fff,transparent),radial-gradient(1px 1px at 150px 120px,#ffe9a8,transparent),radial-gradient(1px 1px at 60px 160px,#fff,transparent);background-size:200px 200px}
body::after{background-image:radial-gradient(1.5px 1.5px at 40px 50px,#ffe9a8,transparent),radial-gradient(1px 1px at 130px 140px,#fff,transparent),radial-gradient(1px 1px at 220px 90px,#fff,transparent);background-size:313px 313px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:calc(var(--stars)*.25)}to{opacity:var(--stars)}}
@media(prefers-reduced-motion:reduce){body::after{animation:none}.b{transition:none}}
#app{position:relative;max-width:46rem;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;padding:18px 4px 12px;color:var(--soft);font-style:italic}
.bar{flex:1;height:3px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);box-shadow:0 0 8px var(--glow)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:30px 24px 34px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 70px var(--glow),inset 0 0 40px rgba(255,255,255,.06)}
.k{margin:0 0 6px;color:var(--gold);font-style:italic;font-size:1.1rem}
h1,h2{font-weight:600;margin:0 0 18px;line-height:1.15}h1{font-size:clamp(2.6rem,10vw,4rem);text-shadow:0 0 28px var(--glow)}h2{font-size:clamp(1.8rem,6vw,2.4rem)}
.txt{white-space:pre-line;font-size:clamp(1.25rem,3.8vw,1.55rem);line-height:1.6;max-width:34em;margin:0 auto;text-wrap:pretty}
.note{max-width:32em;margin:0 auto 20px;color:var(--soft);font-style:italic;font-size:1.1rem;line-height:1.5}
.mn{display:block;font-size:clamp(1.8rem,6vw,2.5rem);font-weight:600;line-height:1.2;margin-bottom:8px}.ref{color:var(--gold);font-style:italic}
.pt{margin:0 0 18px}.pt em{display:block;color:var(--gold);margin-top:4px}
.lit p{margin:0 0 4px;line-height:1.4}.lit i{color:var(--gold)}.lit hr{border:0;border-top:1px solid var(--line);margin:18px auto;width:40%}
.beads{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 18px}
.b{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9d6ff 60%,#8fa4e6);opacity:.35;transition:opacity .4s,box-shadow .4s}.b.on{opacity:1;box-shadow:0 0 14px 4px var(--glow)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.pray,.go{background:linear-gradient(180deg,#fff2c2,#e9c970);color:#2b2a5a;border:0;border-radius:999px;padding:12px 30px;font-size:1.25rem;font-weight:600;box-shadow:0 0 24px var(--glow)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}
.chip{background:transparent;border:1px solid var(--line);border-radius:18px;padding:12px 8px}.chip[aria-pressed="true"]{background:var(--glass);border-color:var(--gold);box-shadow:0 0 22px var(--glow)}.chip b{display:block;font-size:1.25rem}.chip small{color:var(--soft);font-size:1rem}
.sub{color:var(--soft);font-size:1.3rem;margin:0}label{display:block;margin:14px 0 24px;color:var(--soft)}
select{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:100%}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
body::before,body::after{z-index:0}#app{z-index:1}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.rays{position:absolute;left:50%;top:-80vmax;width:160vmax;height:160vmax;margin-left:-80vmax;background:repeating-conic-gradient(rgba(255,244,200,0) 0 8deg,rgba(255,244,200,.16) 10deg 12deg,rgba(255,244,200,0) 14deg 22deg);-webkit-mask:radial-gradient(circle,#000,transparent 50%);mask:radial-gradient(circle,#000,transparent 50%);animation:spin 240s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{position:absolute;bottom:-12vh;width:70vw;height:32vh;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);filter:blur(26px);opacity:.8;animation:dr 60s ease-in-out infinite alternate}
.c1{left:-15vw}.c2{left:30vw;bottom:-17vh;animation-duration:85s;animation-direction:alternate-reverse}.c3{left:62vw;animation-duration:70s}
@keyframes dr{to{transform:translateX(12vw)}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cl{opacity:.28}}
:root[data-theme="dark"] .cl{opacity:.28}
.sst{position:absolute;inset:0;opacity:var(--stars)}
.ss{position:absolute;top:10%;left:75%;width:130px;height:1px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 8px #fff;opacity:0;animation:sh 13s ease-in infinite}
.s2{top:32%;left:25%;animation-delay:6s;animation-duration:19s}
@keyframes sh{0%,92%{opacity:0;transform:translate(0,0) rotate(-30deg)}93%{opacity:1}100%{opacity:0;transform:translate(-320px,185px) rotate(-30deg)}}
.card{position:relative;animation:in .8s ease both;box-shadow:0 0 100px var(--glow),0 24px 60px rgba(0,0,30,.22),inset 0 0 60px rgba(255,255,255,.08)}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.985)}}
.card::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:24px;pointer-events:none}
.card::after{content:"✦";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:1.7rem;line-height:1;color:var(--gold);text-shadow:0 0 14px var(--glow),0 0 28px var(--glow)}
h1,h2{font-family:Cinzel,'Cormorant Garamond',Georgia,serif;letter-spacing:.05em;background:linear-gradient(180deg,var(--ink) 20%,var(--gold) 150%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 16px var(--glow))}
h1{font-size:clamp(2.2rem,8.5vw,3.5rem)}h2{font-size:clamp(1.5rem,5.2vw,2.1rem)}
h1::after,h2::after{content:"";display:block;width:170px;height:12px;margin:14px auto 0;background:radial-gradient(circle,var(--gold) 0 3px,transparent 4px) center/12px 12px no-repeat,linear-gradient(90deg,transparent,var(--gold)) left center/68px 1px no-repeat,linear-gradient(270deg,transparent,var(--gold)) right center/68px 1px no-repeat}
.top span{font-family:Cinzel,Georgia,serif;font-style:normal;letter-spacing:.12em;font-size:.95rem}
.cr{filter:drop-shadow(0 0 14px var(--glow));animation:pu 4s ease-in-out infinite alternate}
@keyframes pu{to{filter:drop-shadow(0 0 30px var(--glow));transform:scale(1.07)}}
.beads{position:relative;gap:12px;margin:32px 0 24px}
.beads::before{content:"";position:absolute;left:4%;right:4%;top:50%;height:1px;background:var(--line)}
.b{position:relative;width:30px;height:30px;box-shadow:inset -3px -4px 7px rgba(70,90,170,.5),0 2px 6px rgba(0,0,30,.3)}
.b.on{box-shadow:inset -3px -4px 7px rgba(190,150,60,.5),0 0 20px 6px var(--glow);transform:scale(1.12)}
.go,.pray,nav button,.chip{transition:transform .25s,box-shadow .25s,border-color .25s}
.go:hover,.pray:hover{transform:translateY(-2px);box-shadow:0 0 44px var(--glow)}
nav button:hover,.chip:hover{box-shadow:0 0 22px var(--glow);border-color:var(--gold)}
.txt{text-shadow:0 0 22px var(--glow)}
@media(prefers-reduced-motion:reduce){.rays,.cl,.ss,.card,.cr,.bd.cur{animation:none}}
.col{min-width:0}.ros{padding:4px 0}.ros svg{display:block;margin:0 auto;height:210px;width:auto;overflow:visible}
@media(min-width:960px){#app.w{max-width:68rem}.lay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:30px;align-items:start}.ros{position:sticky;top:24px;padding-top:70px}.ros svg{width:100%;height:auto}}
.th{fill:none;stroke:var(--line);stroke-width:1.2}
.bd{fill:var(--soft);opacity:.3;transition:fill .6s,opacity .6s,filter .6s}
.bd.on{fill:var(--gold);opacity:1;filter:drop-shadow(0 0 4px var(--glow)) drop-shadow(0 0 9px var(--glow))}
.bd.cur{fill:var(--gold);opacity:1;transform-box:fill-box;transform-origin:center;animation:pl 1.3s ease-in-out infinite alternate}
@keyframes pl{to{transform:scale(1.6);filter:drop-shadow(0 0 10px var(--glow))}}
.rt{font-family:Cinzel,Georgia,serif;text-anchor:middle;fill:var(--gold)}
.sm{display:block;margin-top:18px;font-size:1.2rem;line-height:1.55;color:var(--soft)}
.fr{display:block;margin-top:14px;color:var(--gold);font-style:italic}.lg{display:block;color:var(--soft);font-size:1rem;font-style:italic;margin-bottom:10px}.g2{color:var(--gold);font-style:italic}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 16px}.tools button{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 15px;font-size:1rem;transition:box-shadow .25s,border-color .25s}.tools button:hover,.tools button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 16px var(--glow)}
textarea{display:block;width:100%;box-sizing:border-box;margin-top:8px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:inherit;resize:vertical}
#app .ros{cursor:zoom-in}#app .ros.big{position:fixed;inset:0;top:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(var(--bg1),var(--bg2));cursor:zoom-out}#app .ros.big svg{height:86vh;width:auto}
@media(max-width:959px){.ros svg{height:250px}}
.mq{display:block;margin-top:12px;color:var(--soft);font-style:italic}
.cnt{margin:18px 0 6px}.cnt select{margin:8px 6px}.rs{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:1rem}.rs:hover{border-color:var(--gold);box-shadow:0 0 16px var(--glow)}
html.simple .sky,html.simple body::before,html.simple body::after{display:none}html.simple *,html.simple *::before,html.simple *::after{animation:none!important;transition:none!important}html.simple .txt{font-size:clamp(1.5rem,5vw,1.9rem);text-shadow:none}html.simple .card{box-shadow:none}
.cal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}.cal i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}.cal i.on{background:var(--gold);box-shadow:0 0 10px var(--glow)}.sm2{margin:4px 0;color:var(--soft);font-size:1rem}
details{margin:12px 0;text-align:left;color:var(--soft)}summary{cursor:pointer;text-align:center;color:var(--ink)}details ol{line-height:1.45;font-size:1.05rem;padding-left:1.3em}
input.mi{display:block;width:100%;box-sizing:border-box;margin:6px 0;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;color:inherit}#bkc{margin-bottom:8px}.oi{display:block;margin-top:14px;color:var(--gold)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--glass);border:1px solid var(--gold);border-radius:18px;padding:12px 16px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 0 30px var(--glow)}.upd button{margin-left:8px;border:1px solid var(--gold);background:transparent;border-radius:999px;padding:4px 14px}
</style></head><body>
<div class="sky" aria-hidden="true"><i class="rays"></i><i class="cl c1"></i><i class="cl c2"></i><i class="cl c3"></i><div class="sst"><i class="ss"></i><i class="ss s2"></i></div></div>
<main id="app"></main>
<script>
const PN=`Padre nuestro, que estás en el cielo, santificado sea tu Nombre; venga a nosotros tu Reino; hágase tu voluntad en la tierra como en el cielo. Danos hoy nuestro pan de cada día; perdona nuestras ofensas, como también nosotros perdonamos a los que nos ofenden; no nos dejes caer en la tentación, y líbranos del mal. Amén.`;
const AVE=`Dios te salve, María, llena eres de gracia, el Señor es contigo. Bendita tú eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesús.
Santa María, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amén.`;
const GP=`Gloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén.`;
const JAC=`Oh mi buen Jesús, perdona nuestros pecados, líbranos del fuego del infierno, lleva al cielo a todas las almas, especialmente a las más necesitadas de tu divina misericordia.`;
const SC=`Por la señal de la Santa Cruz,
de nuestros enemigos líbranos, Señor, Dios nuestro.
En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.`;
const GESTO=`Persignarse: tres cruces pequeñas con el pulgar. En la frente, pidiendo pensamientos buenos y puros; en los labios, para que solo salgan palabras de alabanza y bien; en el pecho, para que en el corazón reine el amor. Después, la cruz grande: de la frente al pecho y del hombro izquierdo al derecho.`;
const CREDO=`Creo en Dios, Padre Todopoderoso,
Creador del cielo y de la tierra.
Creo en Jesucristo, su único Hijo,
Nuestro Señor,
que fue concebido por obra y gracia del Espíritu Santo, nació de Santa María Virgen, padeció bajo el poder de Poncio Pilato,
fue crucificado, muerto y sepultado, descendió a los infiernos, al tercer día resucitó de entre los muertos, subió a los cielos y está sentado a la derecha de Dios, Padre todopoderoso. Desde allí ha de venir
a juzgar a vivos y muertos.

Creo en el Espíritu Santo,
la santa Iglesia católica,
la comunión de los santos,
el perdón de los pecados,
la resurrección de la carne
y la vida eterna.
Amén.`;
const CONT=`Jesús, mi Señor y Redentor, yo me arrepiento de todos los pecados que he cometido hasta hoy, y me pesa de todo corazón, porque con ellos he ofendido a un Dios tan bueno. Propongo firmemente no volver a pecar y confío que por tu infinita misericordia me has de conceder el perdón de mis culpas y me has de llevar a la vida eterna. Amén`;
const ESP=`Oh Espíritu Santo,
Amor del Padre, y del Hijo,
Inspírame siempre lo que debo pensar,
lo que debo decir,
cómo debo decirlo,
lo que debo callar,
cómo debo actuar,
lo que debo hacer,
para gloria de Dios,
bien de las almas
y mi propia Santificación.
Espíritu Santo,
Dame agudeza para entender,
capacidad para retener,
método y facultad para aprender,
sutileza para interpretar,
gracia y eficacia para hablar.
Dame acierto al empezar,
dirección al progresar
y perfección al acabar.
Amén.`;
const GLO=`Gloria a Dios en el cielo,
y en la tierra paz a los hombres que ama el Señor.
Por tu inmensa gloria te alabamos,
te bendecimos, te adoramos,
te glorificamos, te damos gracias,
Señor Dios, Rey celestial,
Dios Padre todopoderoso.
Señor, Hijo único, Jesucristo.
Señor Dios, Cordero de Dios, Hijo del Padre;
tú que quitas el pecado del mundo,
ten piedad de nosotros;
tú que quitas el pecado del mundo,
atiende nuestra súplica;
tú que estás sentado a la derecha del Padre,
ten piedad de nosotros;
porque sólo tú eres Santo,
sólo tú Señor, sólo tú Altísimo, Jesucristo,
con el Espíritu Santo
en la gloria de Dios Padre.
Amén.`;
const PETS=['Por la santa Iglesia, por el Papa, los obispos, los sacerdotes y todos los consagrados, para que sean fieles servidores del Evangelio.','Por los gobernantes y por la paz del mundo, para que cesen las guerras y la violencia.','Por nuestras familias, para que vivan unidas en el amor y la fe.','Por los enfermos, los pobres y los que están solos, para que encuentren consuelo y esperanza.','Por los difuntos y las almas del purgatorio, para que descansen en tu paz.','Por nuestras intenciones personales, que ponemos ahora en tus manos.'];
const PET=PETS.map(t=>`<div class="pt">${t}<em>Te lo pedimos, Señor.</em></div>`).join('');
const PAPA=`Ahora rezaremos un Padre nuestro, tres Ave Marías, un Gloria y un Salve Regina por el Santo Padre y por todos los de la Iglesia: para que el Señor lo fortalezca, lo guarde y lo guíe, y conceda a todos los pastores y fieles perseverar en la fe, la esperanza y la caridad.`;
const SAL=`Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra; Dios te salve. A ti llamamos los desterrados hijos de Eva; a ti suspiramos, gimiendo y llorando, en este valle de lágrimas. Ea, pues, Señora, abogada nuestra, vuelve a nosotros esos tus ojos misericordiosos; y después de este destierro muéstranos a Jesús, fruto bendito de tu vientre. ¡Oh clemente, oh piadosa, oh dulce siempre Virgen María!
Ruega por nosotros, Santa Madre de Dios, para que seamos dignos de alcanzar las promesas de Nuestro Señor Jesucristo. Amén.`;
const ANG=`Ángel de mi guarda, mi dulce compañía, no me desampares ni de noche ni de día, hasta que me pongas en paz y alegría, con todos los santos, Jesús, José y María. Si me desamparas, ¿Qué será de mí? Santo Ángel de mi guarda, ruega a Dios por mí. Amén.`;
const MIG=`San Miguel Arcángel, defiéndenos en la batalla. Sé nuestro amparo contra la perversidad y asechanzas del demonio. Reprímale Dios, pedimos suplicantes, y tú, príncipe de la milicia celestial, arroja al infierno con el divino poder a Satanás y a los otros espíritus malignos que andan dispersos por el mundo para la perdición de las almas. Amén`;
const MAG=`Proclama mi alma la grandeza del Señor, se alegra mi espíritu en Dios, mi salvador; porque ha mirado la humillación de su esclava.
A partir de ahora me felicitarán todas las generaciones, porque el Poderoso ha hecho obras grandes por mí: su nombre es santo, y su misericordia llega a sus fieles de generación en generación.
Él hace proezas con su brazo: dispersa a los soberbios de corazón, derriba del trono a los poderosos y enaltece a los humildes, a los hambrientos los colma de bienes y a los ricos los despide vacíos.
Auxilia a Israel, su siervo, acordándose de la misericordia —como lo había prometido a nuestros padres— en favor de Abrahán y su descendencia por siempre.
Amén.`;
const PRO=`Contigo voy, Virgen pura, y en tu poder voy confiado, pues yendo de ti amparado, mi alma volverá segura. ¡Oh Madre mía, oh tierna Madre! Échanos tu bendición y haz que nos bendiga el Padre, el Hijo y el Espíritu Santo. Amén.`;
const FIN=`Que la paz de Cristo y el amparo de María te acompañen. Amén.`;
const row=(a,b)=>`<p>${a} <i>${b}</i></p>`;
const MR='ruega por nosotros.';
